name: Build SuffixRenamer APK

on:
  push:
    branches:
      - chatgpt-build-suffixmanager-20260923
    paths:
      - "chatgpt-suffixrenamer/**"
      - ".github/workflows/build-suffixrenamer-apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Android SDK
        run: |
          SDKMANAGER="/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        working-directory: chatgpt-suffixrenamer
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp chatgpt-suffixrenamer/app/build/outputs/apk/debug/app-debug.apk SuffixRenamer-v1.0.0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SuffixRenamer-v1.0.0
          path: SuffixRenamer-v1.0.0.apk
          if-no-files-found: error
